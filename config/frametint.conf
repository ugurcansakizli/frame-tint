# Frame Tint settings. One per line, NAME=value, no spaces around =. Lines starting with # are ignored.
# Changes apply the next time you start Frame Tint. All settings are described at the top of lib/live_server.py
# (src/server/live_server.py in the repository) and in the README.

# One flat picture from the right camera: the most reliable mode.
# Set FT_STEREO=1 for one view per eye (experimental: exaggerated depth, a black corner per eye).
FT_STEREO=0

# Picture width in pixels: 960 is close to the camera's real detail, 640 is faster.
FT_RES=960

# Size of the panel: 1 = life size (fills most of the view), 0.5 = half size.
FT_SCALE=1

# Color strength (1 = as the model answers) and white balance (0..1, how much of the overall color cast is removed).
FT_VIVID=1.2
FT_BALANCE=0.3
